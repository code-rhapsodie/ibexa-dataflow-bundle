name: PHP Composer

on:
  push:
    branches: [ 'v*.x' ]
  pull_request:
    branches: [ 'v*.x' ]

jobs:
  build:
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        dependencies: [lowest, highest]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: xdebug

    - name: PHP Lint
      run: find src tests -type f -name '*.php' -exec php -l {} \; | (! grep -v "No syntax errors detected" )

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install dependencies (${{ matrix.dependencies }})
      run: composer update --prefer-dist --no-progress --no-scripts --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

    - name: PHPUnit
      run: php -d xdebug.mode=coverage vendor/bin/phpunit --log-junit junit.xml

    - name: Publish Unit Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'push'
      with:
        files: junit.xml

  quality:
    name: Static analysis & code style
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-scripts --no-interaction

    - name: PHP CS Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

    - name: PHPStan
      run: vendor/bin/phpstan analyse --no-progress

    - name: Rector
      run: vendor/bin/rector process --dry-run --no-progress-bar
